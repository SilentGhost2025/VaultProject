version: '3.8'

services:
  quote-service:
    build: ./backend/quote-service
    container_name: quote-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build: ./backend/user-service
    container_name: user-service
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - QUOTE_SERVICE_URL=http://quote-service:8081
    depends_on:
      quote-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build: ./backend/api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - QUOTE_SERVICE_URL=http://quote-service:8081
      - USER_SERVICE_URL=http://user-service:8082
    depends_on:
      quote-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
