server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: user-service

quote-service:
  url: ${QUOTE_SERVICE_URL:http://quote-service:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

info:
  app:
    name: User Service
    version: 1.0.0
    description: In-memory user profile microservice with Feign client
